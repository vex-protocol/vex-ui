    - packages/*

pmOnFail: error

catalog:
    "@expo/vector-icons": ^15.1.1
    "@nanostores/react": ^1.1.0
    "@notifee/react-native": ^9.1.8
    "@types/node": ^24.10.1
    "@vex-chat/crypto": 6.0.0
    "@vex-chat/libvex": 6.7.0
    "@vex-chat/spire": 1.11.5
    "@vex-chat/types": 3.3.1
    dompurify: ^3.4.0
    expo-background-fetch: ~55.0.15
    expo-background-task: ~55.0.17
    expo-audio: ~55.0.14
    expo-clipboard: ~55.0.13
    expo-constants: ~55.0.13
    expo-crypto: ~55.0.14
    expo-document-picker: ~55.0.13
    expo-file-system: ~55.0.17
    expo-image-manipulator: ^55.0.15
    expo-intent-launcher: ~55.0.12
    expo-sharing: ~55.0.18
    expo-task-manager: ~55.0.15
    expo-video: ~55.0.17
    highlight.js: ^11.11.1
    kysely: ^0.28.17
    marked: ^15.0.12
    msgpackr: ^1.11.5
    nanostores: ^1.2.0
    react: 19.2.0
    react-dom: 19.2.0
    react-native-passkey: 3.3.3
    svelte: ^5.55.7
    typescript: ~5.9.3
    uuid: ^14.0.0
    vitest: 3.2.4
    zod: ^4.1.12

catalogMode: strict

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
    - "@vex-chat/libvex"
    - "@vex-chat/types"
    - "@vex-chat/crypto"
    - "@vex-chat/spire"
    - expo-background-fetch
    - expo-background-task
    - expo-task-manager
    - unimodules-app-loader
    - uuid
    - dompurify
    - svelte
    - devalue
    - fast-xml-builder
    - kysely
    - ws
overrides:
    react: 19.2.0
    react-dom: 19.2.0
    kysely: 0.28.17
    typescript: ~5.9.3
    svelte@<4.2.19: ">=4.2.19"
    esbuild@<=0.24.2: ">=0.25.0"
    svelte@<=5.51.4: ">=5.51.5"
    svelte@<=5.53.4: ">=5.53.5"
    svelte@<=5.55.6: ">=5.55.7"
    devalue@>=5.6.3 <=5.8.0: ">=5.8.1"
    vite@>=7.0.0 <=7.3.1: ">=7.3.2"
    vite@>=7.1.0 <=7.3.1: ">=7.3.2"
    follow-redirects@<=1.15.11: ">=1.16.0"
    dompurify@<=3.3.3: ">=3.4.0"
    fast-xml-parser@<5.7.0: ">=5.7.0"
    "@xmldom/xmldom": 0.8.13
    postcss@<8.5.10: ">=8.5.10"
    dompurify@<3.4.0: ">=3.4.0"
    dompurify@>=1.0.10 <3.4.0: ">=3.4.0"
    dompurify@>=3.0.1 <3.4.0: ">=3.4.0"
    fast-xml-builder@<=1.1.6: 1.1.7
    uuid@>=11.0.0 <11.1.1: ">=11.1.1"
    "@angular/compiler@<=18.2.14": 19.2.21
    brace-expansion@>=5.0.0 <5.0.6: 5.0.6
    ws@>=8.0.0 <8.20.1: 8.20.1
peerDependencyRules:
    allowedVersions:
        expo-sqlite: ">=16"
        typescript: ">=5"
        "@sveltejs/vite-plugin-svelte": ">=2"
allowBuilds:
    sharp: true
    better-sqlite3: true
    esbuild: true
    msgpackr-extract: true
