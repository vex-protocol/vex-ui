packages:
    - apps/*
    - packages/*

pmOnFail: error

catalog:
    "@nanostores/react": 1.1.0
    "@sveltejs/vite-plugin-svelte": 6.2.4
    "@types/node": 24.12.2
    "@vex-chat/libvex": 6.7.0
    concurrently: 9.2.1
    eslint-config-prettier: 10.1.8
    highlight.js: 11.11.1
    kysely: 0.28.17
    nanostores: 1.2.0
    prettier-plugin-svelte: 3.5.1
    react: 19.2.0
    react-dom: 19.2.0
    svelte: 5.55.7
    tsx: 4.21.0
    typescript: 5.9.3
    typescript-eslint: 8.58.1
    uuid: 14.0.0
    vite: 7.3.2
    vitest: 3.2.4

catalogMode: prefer
cleanupUnusedCatalogs: true
savePrefix: ""

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
    - "@vex-chat/*"
peerDependencyRules:
    allowedVersions:
        expo-sqlite: ">=16"
        typescript: ">=5"
        "@sveltejs/vite-plugin-svelte": ">=2"
allowBuilds:
    sharp: true
    better-sqlite3: true
    esbuild: true
    msgpackr-extract: true
    svelte-preprocess: false
