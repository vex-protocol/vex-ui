packages:
    - apps/*
    - packages/*

pmOnFail: error

overrides:
    # @expo/config-plugins currently resolves xcode@3.0.1 with uuid@^7.0.3,
    # which is flagged by GHSA-w5hq-g745-h8pq. Remove this override after
    # xcode drops the uuid dependency or Expo picks up a patched xcode release.
    "xcode>uuid": 11.1.1

catalog:
    "@sveltejs/vite-plugin-svelte": 6.2.4
    "@types/node": 24.12.2
    "@vex-chat/libvex": 6.7.0
    concurrently: 9.2.1
    eslint-config-prettier: 10.1.8
    highlight.js: 11.11.1
    kysely: 0.28.17
    nanostores: 1.2.0
    prettier-plugin-svelte: 3.5.1
    react: 19.2.0
    svelte: 5.55.7
    tsx: 4.21.0
    typescript: 5.9.3
    typescript-eslint: 8.58.1
    uuid: 14.0.0
    vite: 7.3.2
    vitest: 3.2.4

catalogMode: prefer
cleanupUnusedCatalogs: true
savePrefix: ""

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@vex-chat/*"
peerDependencyRules:
    allowedVersions:
        expo-sqlite: ">=16"
        typescript: ">=5"
        "@sveltejs/vite-plugin-svelte": ">=2"
allowBuilds:
    esbuild: true
    msgpackr-extract: true
    svelte-preprocess: false
patchedDependencies:
    "@builder.io/mitosis-cli@0.13.0": patches/@builder.io__mitosis-cli@0.13.0.patch
    "@builder.io/mitosis@0.13.0": patches/@builder.io__mitosis@0.13.0.patch
