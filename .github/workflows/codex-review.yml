name: Codex Review Gate

on:
    # This event executes the trusted base-branch workflow instead of code from
    # the pull request, which keeps the write-scoped status token isolated.
    pull_request_target:
        branches:
            - development
            - master
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
            - converted_to_draft
            - edited
    schedule:
        - cron: "7,22,37,52 * * * *"

concurrency:
    group: codex-review-${{ github.event.pull_request.number || 'recovery' }}
    cancel-in-progress: true

permissions:
    contents: read
    issues: write
    pull-requests: read
    statuses: write

jobs:
    codex-review:
        name: Monitor Codex Review
        if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 42
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Test review gate
              run: node --test .github/scripts/codex-review-gate.test.mjs

            - name: Wait for a clean Codex review
              env:
                  CODEX_REVIEW_INTERVAL_MS: "15000"
                  CODEX_REVIEW_TIMEOUT_MS: "1800000"
                  GH_TOKEN: ${{ github.token }}
                  PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
              run: node .github/scripts/codex-review-gate.mjs

    recover-reviews:
        name: Recover Codex Reviews
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Test review gate
              run: node --test .github/scripts/codex-review-gate.test.mjs

            - name: Recover late Codex reviews
              env:
                  CODEX_REVIEW_RECOVERY: "1"
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: node .github/scripts/codex-review-gate.mjs
