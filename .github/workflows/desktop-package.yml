name: Desktop - Package

on:
    push:
        branches: [development, master]
        paths:
            - .github/workflows/desktop-package.yml
            - .tool-versions
            - .pnpmfile.cjs
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - tsconfig.json
            - apps/desktop/**
            - packages/store/**
    pull_request:
        branches: [development, master]
        paths:
            - .github/workflows/desktop-package.yml
            - .tool-versions
            - .pnpmfile.cjs
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - tsconfig.json
            - apps/desktop/**
            - packages/store/**
    workflow_dispatch:
        inputs:
            flavor:
                description: Desktop environment to package.
                required: true
                default: development
                type: choice
                options:
                    - development
                    - production

concurrency:
    group: desktop-package-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    settings:
        name: Select flavor
        runs-on: ubuntu-24.04
        outputs:
            flavor: ${{ steps.flavor.outputs.flavor }}
        steps:
            - name: Resolve desktop flavor
              id: flavor
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_FLAVOR: ${{ inputs.flavor }}
                  TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    FLAVOR="$REQUESTED_FLAVOR"
                  elif [ "$TARGET_BRANCH" = "master" ]; then
                    FLAVOR="production"
                  else
                    FLAVOR="development"
                  fi

                  case "$FLAVOR" in
                    development|production) ;;
                    *)
                      echo "::error::Unsupported desktop flavor: $FLAVOR"
                      exit 1
                      ;;
                  esac

                  echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
                  echo "Packaging the $FLAVOR desktop flavor."

    package:
        name: ${{ matrix.label }} (${{ needs.settings.outputs.flavor }})
        needs: settings
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: macOS Apple Silicon
                      runner: macos-15
                      platform: macos
                      architecture: arm64
                      rust-host: aarch64-apple-darwin
                      bundles: dmg
                      artifact: macos-arm64
                    - label: macOS Intel
                      runner: macos-15-intel
                      platform: macos
                      architecture: x64
                      rust-host: x86_64-apple-darwin
                      bundles: dmg
                      artifact: macos-x64
                    - label: Windows x64
                      runner: windows-2025
                      platform: windows
                      architecture: x64
                      rust-host: x86_64-pc-windows-msvc
                      bundles: nsis,msi
                      artifact: windows-x64
                    - label: Linux x64
                      runner: ubuntu-24.04
                      platform: linux
                      architecture: x64
                      rust-host: x86_64-unknown-linux-gnu
                      bundles: deb
                      artifact: linux-x64
        env:
            CARGO_TERM_COLOR: always
            CI: true
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install Linux system dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --assume-yes --no-install-recommends \
                    build-essential \
                    curl \
                    file \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    libxdo-dev \
                    wget

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .tool-versions
                  cache: pnpm

            - name: Install Rust
              run: |
                  rustup toolchain install stable --profile minimal --no-self-update
                  rustup default stable
                  rustc --version --verbose

            - name: Verify native build target
              env:
                  EXPECTED_RUST_HOST: ${{ matrix.rust-host }}
              run: >-
                  node -e "const { execFileSync } = require('node:child_process'); const details = execFileSync('rustc', ['--version', '--verbose'], { encoding: 'utf8' }); const host = /^host: (.+)$/m.exec(details)?.[1]; if (host !== process.env.EXPECTED_RUST_HOST) { console.error('Expected Rust host ' + process.env.EXPECTED_RUST_HOST + ', got ' + (host || 'unknown')); process.exit(1); }"

            - name: Restore Rust build cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                      apps/desktop/src-tauri/target
                  key: desktop-cargo-${{ runner.os }}-${{ matrix.architecture }}-${{ needs.settings.outputs.flavor }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
                  restore-keys: |
                      desktop-cargo-${{ runner.os }}-${{ matrix.architecture }}-${{ needs.settings.outputs.flavor }}-

            - name: Install JavaScript dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Clear stale installer outputs
              run: >-
                  node -e "require('node:fs').rmSync('apps/desktop/src-tauri/target/release/bundle', { force: true, recursive: true })"

            - name: Build native installers
              run: pnpm --filter @vex-chat/desktop run "build:${{ needs.settings.outputs.flavor }}" -- --bundles "${{ matrix.bundles }}" --ci --no-sign

            - name: Verify and collect installers
              run: node apps/desktop/scripts/collect-ci-artifacts.mjs --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}" --flavor "${{ needs.settings.outputs.flavor }}" --output "artifacts/${{ matrix.artifact }}"

            - name: Upload installers
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: vex-desktop-${{ needs.settings.outputs.flavor }}-${{ matrix.artifact }}
                  path: apps/desktop/artifacts/${{ matrix.artifact }}/
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 30
