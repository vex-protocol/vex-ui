name: Mobile - Release

# Publishes production for every merge to master.
# Native fingerprint unchanged -> EAS Update on the production channel.
# Native fingerprint changed   -> EAS Android APK + iOS Ad Hoc builds,
#                                  plus GitHub Release.
#
# APK release versions are derived from mobile-v* tags. OTA updates reuse the
# latest APK's version/runtime so installed builds can receive the update.
#
# Concurrency: cancel-in-progress:false. Canceling an EAS build while it is
# talking to remote versionCode state can corrupt the queued version state, so
# queued builds always run to completion.
#
# Secrets: EXPO_TOKEN, GITHUB_TOKEN (automatic).
# Required secret: VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON_BASE64.
# Fallback raw JSON secret: VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON.

on:
    push:
        branches: [master]
    workflow_dispatch:
        inputs:
            force_build:
                description: Build and publish fresh native artifacts even when the native fingerprint is unchanged.
                required: false
                default: false
                type: boolean

concurrency:
    group: release-mobile
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .tool-versions
                  cache: pnpm

            - name: Resolve release baseline
              id: baseline
              run: |
                  git fetch --force --tags
                  PACKAGE_VERSION=$(node -pe "require('./apps/mobile/package.json').version")
                  HEAD_TAG=$(git tag --points-at HEAD --list 'mobile-v*' | sort -V | tail -n 1)
                  LATEST_TAG=$(git describe --tags --match='mobile-v*' --abbrev=0 2>/dev/null || echo '')
                  if [ -n "$HEAD_TAG" ]; then
                    BASE_VERSION="${HEAD_TAG#mobile-v}"
                    FINGERPRINT_TAG="$HEAD_TAG"
                    NOTES_PREV_TAG=$(git describe --tags --match='mobile-v*' --abbrev=0 HEAD^ 2>/dev/null || echo '')
                    echo "Reusing existing HEAD tag as baseline: $HEAD_TAG"
                  elif [ -n "$LATEST_TAG" ]; then
                    BASE_VERSION="${LATEST_TAG#mobile-v}"
                    FINGERPRINT_TAG="$LATEST_TAG"
                    NOTES_PREV_TAG="$LATEST_TAG"
                    echo "Latest APK baseline: $LATEST_TAG"
                  else
                    BASE_VERSION="$PACKAGE_VERSION"
                    FINGERPRINT_TAG=""
                    NOTES_PREV_TAG=""
                    echo "No previous mobile-v* tag; using package baseline ${PACKAGE_VERSION}"
                  fi

                  echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "head_tag=$HEAD_TAG" >> "$GITHUB_OUTPUT"
                  echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
                  echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "fingerprint_tag=$FINGERPRINT_TAG" >> "$GITHUB_OUTPUT"
                  echo "notes_previous_tag=$NOTES_PREV_TAG" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Prepare production Firebase config
              working-directory: apps/mobile
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON }}
                  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON_BASE64 }}
              run: |
                  GOOGLE_SERVICES_PATH="google-services.prod.json"
                  export GOOGLE_SERVICES_PATH
                  if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
                    printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GOOGLE_SERVICES_PATH"
                  elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
                    printf '%s' "$GOOGLE_SERVICES_JSON" > "$GOOGLE_SERVICES_PATH"
                  else
                    echo "::error::Missing VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON_BASE64. Add it from apps/mobile/google-services.prod.json so CI can reproduce the local prod build."
                    exit 1
                  fi

                  node -e '
                    const fs = require("node:fs");
                    const path = process.env.GOOGLE_SERVICES_PATH;
                    const expected = "chat.vex.mobile";
                    const data = JSON.parse(fs.readFileSync(path, "utf8"));
                    const packages = (data.client ?? [])
                      .map((client) => client.client_info?.android_client_info?.package_name)
                      .filter(Boolean);
                    if (!packages.includes(expected)) {
                      console.error(`${path} does not contain Android package ${expected}`);
                      console.error(`Found package(s): ${packages.join(", ") || "(none)"}`);
                      process.exit(1);
                    }
                  '
                  echo "VEX_ANDROID_GOOGLE_SERVICES_FILE=./${GOOGLE_SERVICES_PATH}" >> "$GITHUB_ENV"

            - name: Compute current runtime fingerprints
              id: fp
              working-directory: apps/mobile
              env:
                  EAS_BUILD_PROFILE: production
                  VEX_APP_ENV: production
                  VEX_APP_DISPLAY_NAME: Vex
                  VEX_APP_VERSION: ${{ steps.baseline.outputs.base_version }}
                  VEX_ENABLE_DEV_BUILD: "0"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile
                  VEX_PASSKEY_RP_HOST: api.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  npx expo-updates fingerprint:generate --platform android --workflow managed > /tmp/current-fingerprint-android.json
                  npx expo-updates fingerprint:generate --platform ios --workflow managed > /tmp/current-fingerprint-ios.json
                  npx @expo/fingerprint@latest . > /tmp/current-fingerprint.json

                  ANDROID_HASH=$(node -pe "require('/tmp/current-fingerprint-android.json').hash")
                  IOS_HASH=$(node -pe "require('/tmp/current-fingerprint-ios.json').hash")
                  LEGACY_HASH=$(node -pe "require('/tmp/current-fingerprint.json').hash")

                  echo "android_hash=$ANDROID_HASH" >> "$GITHUB_OUTPUT"
                  echo "ios_hash=$IOS_HASH" >> "$GITHUB_OUTPUT"
                  echo "legacy_hash=$LEGACY_HASH" >> "$GITHUB_OUTPUT"
                  echo "Current Android runtime fingerprint: $ANDROID_HASH"
                  echo "Current iOS runtime fingerprint: $IOS_HASH"
                  echo "Current legacy fingerprint: $LEGACY_HASH"

            - name: Install EAS CLI
              run: npm install -g eas-cli@latest

            - name: Resolve previous runtime fingerprints
              id: prev_fp
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ steps.baseline.outputs.fingerprint_tag }}"
                  if eas build:list \
                        --platform all \
                        --status finished \
                        --channel production \
                        --build-profile production \
                        --distribution internal \
                        --limit 20 \
                        --json \
                        --non-interactive > /tmp/previous-eas-builds.json; then
                    echo "Fetched previous EAS build runtimes."
                  else
                    echo "::warning::Could not fetch previous EAS build runtimes; falling back to GitHub release fingerprints."
                    printf '[]\n' > /tmp/previous-eas-builds.json
                  fi

                  if [ -n "$TAG" ] && gh release download "$TAG" \
                        --pattern 'fingerprint-android.json' \
                        --output /tmp/prev-fingerprint-android.json 2>/dev/null; then
                    echo "Downloaded fallback Android runtime fingerprint asset."
                  else
                    echo "Fallback Android runtime fingerprint asset missing."
                  fi

                  if [ -n "$TAG" ] && gh release download "$TAG" \
                        --pattern 'fingerprint-ios.json' \
                        --output /tmp/prev-fingerprint-ios.json 2>/dev/null; then
                    echo "Downloaded fallback iOS runtime fingerprint asset."
                  else
                    echo "Fallback iOS runtime fingerprint asset missing."
                  fi

                  EAS_BUILDS_JSON=/tmp/previous-eas-builds.json \
                    FALLBACK_ANDROID_FINGERPRINT_JSON=/tmp/prev-fingerprint-android.json \
                    FALLBACK_IOS_FINGERPRINT_JSON=/tmp/prev-fingerprint-ios.json \
                    node scripts/resolve-previous-runtime-fingerprints.cjs

            - name: Decide path
              id: decide
              env:
                  FORCE_BUILD: ${{ inputs.force_build || false }}
              run: |
                  if [ "$FORCE_BUILD" = "true" ]; then
                    PATH_DECISION=build
                    echo "Force build requested via workflow_dispatch."
                  elif [ "${{ steps.prev_fp.outputs.exists }}" = "true" ] && \
                     [ "${{ steps.fp.outputs.android_hash }}" = "${{ steps.prev_fp.outputs.android_hash }}" ] && \
                     [ "${{ steps.fp.outputs.ios_hash }}" = "${{ steps.prev_fp.outputs.ios_hash }}" ]; then
                    PATH_DECISION=ota
                  else
                    PATH_DECISION=build
                  fi
                  echo "path=$PATH_DECISION" >> "$GITHUB_OUTPUT"
                  echo "Decision: $PATH_DECISION"

            - name: Push OTA update
              if: steps.decide.outputs.path == 'ota'
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_BUILD_PROFILE: production
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "0"
                  EXPO_PUBLIC_SERVER_URL: api.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.baseline.outputs.base_version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: production
                  VEX_APP_DISPLAY_NAME: Vex
                  VEX_APP_VERSION: ${{ steps.baseline.outputs.base_version }}
                  VEX_ENABLE_DEV_BUILD: "0"
                  VEX_ANDROID_RUNTIME_VERSION: ${{ steps.prev_fp.outputs.android_hash }}
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile
                  VEX_IOS_RUNTIME_VERSION: ${{ steps.prev_fp.outputs.ios_hash }}
                  VEX_PASSKEY_RP_HOST: api.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  eas update \
                    --channel production \
                    --message "production ${GITHUB_SHA::8}" \
                    --environment production \
                    --non-interactive

            - name: Push iOS developer-mode OTA update
              if: steps.decide.outputs.path == 'ota'
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_BUILD_PROFILE: production
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "0"
                  EXPO_PUBLIC_SERVER_URL: api.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.baseline.outputs.base_version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: production
                  VEX_APP_DISPLAY_NAME: Vex
                  VEX_APP_VERSION: ${{ steps.baseline.outputs.base_version }}
                  VEX_ENABLE_DEV_BUILD: "0"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile
                  VEX_PASSKEY_RP_HOST: api.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: developer
              run: |
                  eas update \
                    --channel production \
                    --platform ios \
                    --message "production ios-dev ${GITHUB_SHA::8}" \
                    --environment production \
                    --non-interactive

            - name: Resolve release version
              if: steps.decide.outputs.path == 'build'
              id: version
              env:
                  HEAD_TAG: ${{ steps.baseline.outputs.head_tag }}
                  LATEST_TAG: ${{ steps.baseline.outputs.latest_tag }}
                  BASE_VERSION: ${{ steps.baseline.outputs.base_version }}
                  PACKAGE_VERSION: ${{ steps.baseline.outputs.package_version }}
              run: |
                  if [ -n "$HEAD_TAG" ]; then
                    VERSION="${HEAD_TAG#mobile-v}"
                    echo "Reusing version from existing HEAD tag: $HEAD_TAG"
                  elif [ -z "$LATEST_TAG" ]; then
                    VERSION="$PACKAGE_VERSION"
                    echo "Resolved first version from package.json: ${VERSION}"
                  else
                    VERSION=$(BASE_VERSION="$BASE_VERSION" PACKAGE_VERSION="$PACKAGE_VERSION" node -e '
                      const base = process.env.BASE_VERSION;
                      const pkg = process.env.PACKAGE_VERSION;
                      const parse = (value, label) => {
                        const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value ?? "");
                        if (!match) {
                          console.error(`Invalid ${label} version: ${value}`);
                          process.exit(1);
                        }
                        return match.slice(1).map(Number);
                      };
                      const compare = (left, right) => {
                        for (let i = 0; i < 3; i += 1) {
                          if (left[i] !== right[i]) return left[i] - right[i];
                        }
                        return 0;
                      };
                      const baseParts = parse(base, "mobile release base");
                      const pkgParts = parse(pkg, "mobile package");
                      if (compare(pkgParts, baseParts) > 0) {
                        console.log(pkg);
                        process.exit(0);
                      }
                      const [major, minor, patch] = baseParts;
                      console.log(`${major}.${minor}.${Number(patch) + 1}`);
                    ')
                    echo "Resolved next APK version from latest tag ${BASE_VERSION} and package ${PACKAGE_VERSION}: ${VERSION}"
                  fi

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=mobile-v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "asset=vex-${VERSION}.apk" >> "$GITHUB_OUTPUT"

            - name: Compute build runtime fingerprints
              if: steps.decide.outputs.path == 'build'
              id: build_fp
              working-directory: apps/mobile
              env:
                  EAS_BUILD_PROFILE: production
                  VEX_APP_ENV: production
                  VEX_APP_DISPLAY_NAME: Vex
                  VEX_APP_VERSION: ${{ steps.version.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "0"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile
                  VEX_PASSKEY_RP_HOST: api.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  npx expo-updates fingerprint:generate --platform android --workflow managed > /tmp/current-fingerprint-android.json
                  npx expo-updates fingerprint:generate --platform ios --workflow managed > /tmp/current-fingerprint-ios.json
                  npx @expo/fingerprint@latest . > /tmp/current-fingerprint.json
                  ANDROID_HASH=$(node -pe "require('/tmp/current-fingerprint-android.json').hash")
                  IOS_HASH=$(node -pe "require('/tmp/current-fingerprint-ios.json').hash")
                  LEGACY_HASH=$(node -pe "require('/tmp/current-fingerprint.json').hash")
                  echo "android_hash=$ANDROID_HASH" >> "$GITHUB_OUTPUT"
                  echo "ios_hash=$IOS_HASH" >> "$GITHUB_OUTPUT"
                  echo "legacy_hash=$LEGACY_HASH" >> "$GITHUB_OUTPUT"
                  echo "Build Android runtime fingerprint: $ANDROID_HASH"
                  echo "Build iOS runtime fingerprint: $IOS_HASH"
                  echo "Build legacy fingerprint: $LEGACY_HASH"

            - name: Prepare EAS remote build env
              if: steps.decide.outputs.path == 'build'
              working-directory: apps/mobile
              env:
                  EAS_BUILD_PROFILE: production
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "0"
                  EXPO_PUBLIC_SERVER_URL: api.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.version.outputs.version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: production
                  VEX_APP_DISPLAY_NAME: Vex
                  VEX_APP_VERSION: ${{ steps.version.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "0"
                  VEX_ANDROID_RUNTIME_VERSION: ${{ steps.build_fp.outputs.android_hash }}
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile
                  VEX_IOS_RUNTIME_VERSION: ${{ steps.build_fp.outputs.ios_hash }}
                  VEX_PASSKEY_RP_HOST: api.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: node scripts/prepare-eas-build-env.cjs

            - name: Build production native artifacts
              if: steps.decide.outputs.path == 'build'
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_BUILD_PROFILE: production
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "0"
                  EXPO_PUBLIC_SERVER_URL: api.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.version.outputs.version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: production
                  VEX_APP_DISPLAY_NAME: Vex
                  VEX_APP_VERSION: ${{ steps.version.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "0"
                  VEX_ANDROID_RUNTIME_VERSION: ${{ steps.build_fp.outputs.android_hash }}
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile
                  VEX_IOS_RUNTIME_VERSION: ${{ steps.build_fp.outputs.ios_hash }}
                  VEX_PASSKEY_RP_HOST: api.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  eas build \
                    --profile production \
                    --platform all \
                    --non-interactive \
                    --wait \
                    --message "production ${GITHUB_SHA::8}" \
                    --json > /tmp/native-builds.json \
                    2> >(node scripts/redact-eas-log.cjs)

                  EXPECTED_ANDROID_RUNTIME_VERSION="${{ steps.build_fp.outputs.android_hash }}" \
                    EXPECTED_IOS_RUNTIME_VERSION="${{ steps.build_fp.outputs.ios_hash }}" \
                    node scripts/assert-eas-runtime-versions.cjs

                  node <<'NODE' > /tmp/android-artifact-url
                  const fs = require("node:fs");
                  const raw = fs.readFileSync("/tmp/native-builds.json", "utf8");
                  const parsed = JSON.parse(raw);
                  const builds = Array.isArray(parsed) ? parsed : [parsed];
                  const build = builds.find((candidate) =>
                    String(candidate?.platform ?? "").toLowerCase() === "android"
                  );
                  const artifactUrl = build?.artifacts?.applicationArchiveUrl;
                  if (!artifactUrl) {
                    console.error("EAS Android build output did not include an APK artifact URL.");
                    console.error(build?.id ? `Build id: ${build.id}` : "Build id: unknown");
                    process.exit(1);
                  }
                  console.log(artifactUrl);
                  NODE

                  curl --fail --location --silent --show-error \
                    "$(cat /tmp/android-artifact-url)" \
                    --output "${{ github.workspace }}/release.apk"
                  test -s "${{ github.workspace }}/release.apk"

                  IOS_INSTALL_PROFILE=production \
                    IOS_INSTALL_CHANNEL=production \
                    IOS_BUNDLE_IDENTIFIER=chat.vex.mobile \
                    IOS_APP_VERSION="${{ steps.version.outputs.version }}" \
                    node scripts/write-ios-install-metadata.cjs

            - name: Build release notes
              if: steps.decide.outputs.path == 'build'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PREV_TAG: ${{ steps.baseline.outputs.notes_previous_tag }}
              run: |
                  PR=$(gh pr list \
                    --search "${{ github.sha }}" \
                    --state merged \
                    --base master \
                    --limit 1 \
                    --json number,title,author,body \
                    -q '.[0] // empty')

                  if [ -n "$PR" ]; then
                    NUMBER=$(jq -r '.number' <<< "$PR")
                    TITLE=$(jq -r '.title' <<< "$PR")
                    AUTHOR=$(jq -r '.author.login' <<< "$PR")
                    BODY=$(jq -r '.body // ""' <<< "$PR")
                    {
                      echo "## What's new"
                      echo ""
                      echo "Released from #${NUMBER} ${TITLE} by @${AUTHOR}."
                      if [ -n "$BODY" ]; then
                        echo ""
                        echo "$BODY"
                      fi
                      echo ""
                      echo "iOS install:"
                      node -pe "require('${{ github.workspace }}/ios-install.json').installUrl"
                    } > /tmp/release-notes.md
                  else
                    {
                      echo "## What's new"
                      echo ""
                      if [ -n "$PREV_TAG" ]; then
                        git log "$PREV_TAG"..HEAD --format='- %s'
                      else
                        git log --format='- %s' -20
                      fi
                      echo ""
                      echo "iOS install:"
                      node -pe "require('${{ github.workspace }}/ios-install.json').installUrl"
                    } > /tmp/release-notes.md
                  fi

                  echo "--- release notes ---"
                  cat /tmp/release-notes.md

            - name: Create or update GitHub Release
              if: steps.decide.outputs.path == 'build'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ steps.version.outputs.tag }}"
                  TITLE="Vex ${{ steps.version.outputs.version }}"
                  ASSET="${{ steps.version.outputs.asset }}"
                  cp release.apk "$ASSET"
                  sha256sum "$ASSET" > "$ASSET.sha256"
                  cp /tmp/current-fingerprint.json fingerprint.json
                  cp /tmp/current-fingerprint-android.json fingerprint-android.json
                  cp /tmp/current-fingerprint-ios.json fingerprint-ios.json

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" "$ASSET" --clobber
                    gh release upload "$TAG" "$ASSET.sha256" --clobber
                    gh release upload "$TAG" fingerprint.json --clobber
                    gh release upload "$TAG" fingerprint-android.json --clobber
                    gh release upload "$TAG" fingerprint-ios.json --clobber
                    gh release upload "$TAG" ios-install.json --clobber
                    gh release edit "$TAG" \
                      --target "$GITHUB_SHA" \
                      --title "$TITLE" \
                      --notes-file /tmp/release-notes.md \
                      --latest
                  else
                    gh release create "$TAG" "$ASSET" "$ASSET.sha256" fingerprint.json fingerprint-android.json fingerprint-ios.json ios-install.json \
                      --target "$GITHUB_SHA" \
                      --latest \
                      --title "$TITLE" \
                      --notes-file /tmp/release-notes.md
                  fi
