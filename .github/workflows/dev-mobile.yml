name: Mobile - Release Candidate

# Publishes the development channel for every merge to development.
# Native fingerprint unchanged -> EAS Update on the development channel.
# Native fingerprint changed   -> EAS Android APK + iOS Ad Hoc builds,
#                                  plus GitHub prereleases:
#   - mobile-rc-v<version>-<sha>  durable GitHub prerelease
#   - mobile-rc-latest            rolling GitHub prerelease pointer
#
# Concurrency: cancel-in-progress:false. Canceling an EAS build while it is
# talking to remote versionCode state can corrupt the queued version state, so
# queued builds always run to completion.
#
# Secrets: EXPO_TOKEN, GITHUB_TOKEN (automatic).
# Required secret: VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON_BASE64.
# Fallback raw JSON secret: VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON.

on:
    push:
        branches: [development]
    workflow_dispatch:
        inputs:
            force_build:
                description: Build and publish a fresh RC APK even when the native fingerprint is unchanged.
                required: false
                default: false
                type: boolean

concurrency:
    group: mobile-release-candidate
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-candidate:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
              with:
                  egress-policy: audit

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .tool-versions
                  cache: pnpm

            - run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Prepare development Firebase config
              working-directory: apps/mobile
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON }}
                  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON_BASE64 }}
              run: |
                  GOOGLE_SERVICES_PATH="google-services.dev.json"
                  export GOOGLE_SERVICES_PATH
                  if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
                    printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GOOGLE_SERVICES_PATH"
                  elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
                    printf '%s' "$GOOGLE_SERVICES_JSON" > "$GOOGLE_SERVICES_PATH"
                  else
                    echo "::error::Missing VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON_BASE64. Add it from apps/mobile/google-services.dev.json so CI can reproduce the local dev build."
                    exit 1
                  fi

                  node -e '
                    const fs = require("node:fs");
                    const path = process.env.GOOGLE_SERVICES_PATH;
                    const expected = "chat.vex.mobile.dev";
                    const data = JSON.parse(fs.readFileSync(path, "utf8"));
                    const packages = (data.client ?? [])
                      .map((client) => client.client_info?.android_client_info?.package_name)
                      .filter(Boolean);
                    if (!packages.includes(expected)) {
                      console.error(`${path} does not contain Android package ${expected}`);
                      console.error(`Found package(s): ${packages.join(", ") || "(none)"}`);
                      process.exit(1);
                    }
                  '
                  echo "VEX_ANDROID_GOOGLE_SERVICES_FILE=./${GOOGLE_SERVICES_PATH}" >> "$GITHUB_ENV"

            - name: Resolve release candidate version
              id: meta
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  LATEST_TAG="$(
                    gh release list --limit 50 --json tagName,isPrerelease \
                      --jq '[.[] | select(.isPrerelease | not) | .tagName | select(test("^mobile-v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0] // ""'
                  )"
                  PACKAGE_VERSION="$(node -pe "require('./apps/mobile/package.json').version")"
                  VERSION="$(
                    LATEST_TAG="$LATEST_TAG" PACKAGE_VERSION="$PACKAGE_VERSION" node <<'NODE'
                  const latestTag = process.env.LATEST_TAG ?? "";
                  const packageVersion = process.env.PACKAGE_VERSION ?? "";
                  const latestVersion = latestTag.match(/^mobile-v(\d+\.\d+\.\d+)$/)?.[1];
                  const parse = (value, label) => {
                    const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value ?? "");
                    if (!match) {
                      console.error(`Invalid ${label} version: ${value}`);
                      process.exit(1);
                    }
                    return match.slice(1).map(Number);
                  };
                  const compare = (left, right) => {
                    for (let i = 0; i < 3; i += 1) {
                      if (left[i] !== right[i]) return left[i] - right[i];
                    }
                    return 0;
                  };
                  const baseParts = parse(latestVersion ?? packageVersion, "mobile release base");
                  const nextRcParts = [baseParts[0], baseParts[1], baseParts[2] + 1];
                  const packageParts = parse(packageVersion, "mobile package");
                  const chosen = compare(packageParts, nextRcParts) > 0 ? packageParts : nextRcParts;
                  console.log(chosen.join("."));
                  NODE
                  )"
                  SHORT_SHA="${GITHUB_SHA::8}"
                  DISPLAY_VERSION="${VERSION}RC-${SHORT_SHA}"

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
                  echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
                  echo "tag=mobile-rc-v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
                  echo "asset=vex-development-${VERSION}-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

                  echo "Latest production mobile tag: ${LATEST_TAG:-none}"
                  echo "Release candidate version: $DISPLAY_VERSION"

            - name: Compute current runtime fingerprints
              id: fp
              working-directory: apps/mobile
              env:
                  EAS_BUILD_PROFILE: development
                  VEX_APP_ENV: development
                  VEX_APP_DISPLAY_NAME: Vex Development
                  VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "1"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile.dev
                  VEX_PASSKEY_RP_HOST: dev.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  npx expo-updates fingerprint:generate --platform android --workflow managed > /tmp/current-fingerprint-android.json
                  npx expo-updates fingerprint:generate --platform ios --workflow managed > /tmp/current-fingerprint-ios.json
                  npx @expo/fingerprint@latest . > /tmp/current-fingerprint.json

                  ANDROID_HASH=$(node -pe "require('/tmp/current-fingerprint-android.json').hash")
                  IOS_HASH=$(node -pe "require('/tmp/current-fingerprint-ios.json').hash")
                  LEGACY_HASH=$(node -pe "require('/tmp/current-fingerprint.json').hash")

                  echo "android_hash=$ANDROID_HASH" >> "$GITHUB_OUTPUT"
                  echo "ios_hash=$IOS_HASH" >> "$GITHUB_OUTPUT"
                  echo "legacy_hash=$LEGACY_HASH" >> "$GITHUB_OUTPUT"
                  echo "Current Android runtime fingerprint: $ANDROID_HASH"
                  echo "Current iOS runtime fingerprint: $IOS_HASH"
                  echo "Current legacy fingerprint: $LEGACY_HASH"

            - name: Download previous runtime fingerprint assets
              id: prev_fp
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release download mobile-rc-latest \
                        --pattern 'fingerprint-android.json' \
                        --output /tmp/prev-fingerprint-android.json 2>/dev/null; then
                    PREV_ANDROID_HASH=$(node -pe "require('/tmp/prev-fingerprint-android.json').hash")
                    echo "android_hash=$PREV_ANDROID_HASH" >> "$GITHUB_OUTPUT"
                    echo "Previous Android runtime fingerprint: $PREV_ANDROID_HASH"
                  else
                    echo "Previous Android runtime fingerprint missing; will build"
                  fi

                  if gh release download mobile-rc-latest \
                        --pattern 'fingerprint-ios.json' \
                        --output /tmp/prev-fingerprint-ios.json 2>/dev/null; then
                    PREV_IOS_HASH=$(node -pe "require('/tmp/prev-fingerprint-ios.json').hash")
                    echo "ios_hash=$PREV_IOS_HASH" >> "$GITHUB_OUTPUT"
                    echo "Previous iOS runtime fingerprint: $PREV_IOS_HASH"
                  else
                    echo "Previous iOS runtime fingerprint missing; will build"
                  fi

                  if [ -n "${PREV_ANDROID_HASH:-}" ] && [ -n "${PREV_IOS_HASH:-}" ]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Decide path
              id: decide
              env:
                  FORCE_BUILD: ${{ inputs.force_build || false }}
              run: |
                  if [ "$FORCE_BUILD" = "true" ]; then
                    PATH_DECISION=build
                    echo "Force build requested via workflow_dispatch."
                  elif [ "${{ steps.prev_fp.outputs.exists }}" = "true" ] && \
                     [ "${{ steps.fp.outputs.android_hash }}" = "${{ steps.prev_fp.outputs.android_hash }}" ] && \
                     [ "${{ steps.fp.outputs.ios_hash }}" = "${{ steps.prev_fp.outputs.ios_hash }}" ]; then
                    PATH_DECISION=ota
                  else
                    PATH_DECISION=build
                  fi
                  echo "path=$PATH_DECISION" >> "$GITHUB_OUTPUT"
                  echo "Decision: $PATH_DECISION"

            - name: Install EAS CLI (OTA path)
              if: steps.decide.outputs.path == 'ota'
              run: npm install -g eas-cli@latest

            - name: Push OTA update
              if: steps.decide.outputs.path == 'ota'
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_BUILD_PROFILE: development
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "1"
                  EXPO_PUBLIC_SERVER_URL: dev.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.display_version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: development
                  VEX_APP_DISPLAY_NAME: Vex Development
                  VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "1"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile.dev
                  VEX_PASSKEY_RP_HOST: dev.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  eas update \
                    --channel development \
                    --message "development ${GITHUB_SHA::8}" \
                    --environment development \
                    --non-interactive

            - name: Push iOS developer-mode OTA update
              if: steps.decide.outputs.path == 'ota'
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_BUILD_PROFILE: development
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "1"
                  EXPO_PUBLIC_SERVER_URL: dev.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.display_version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: development
                  VEX_APP_DISPLAY_NAME: Vex Development
                  VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "1"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile.dev
                  VEX_PASSKEY_RP_HOST: dev.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: developer
              run: |
                  eas update \
                    --channel development \
                    --platform ios \
                    --message "development ios-dev ${GITHUB_SHA::8}" \
                    --environment development \
                    --non-interactive

            - name: Install EAS CLI (build path)
              if: steps.decide.outputs.path == 'build'
              run: npm install -g eas-cli@latest

            - name: Prepare EAS remote build env
              if: steps.decide.outputs.path == 'build'
              working-directory: apps/mobile
              env:
                  EAS_BUILD_PROFILE: development
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "1"
                  EXPO_PUBLIC_SERVER_URL: dev.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.display_version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: development
                  VEX_APP_DISPLAY_NAME: Vex Development
                  VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "1"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile.dev
                  VEX_PASSKEY_RP_HOST: dev.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: node scripts/prepare-eas-build-env.cjs

            - name: Build development native artifacts
              if: steps.decide.outputs.path == 'build'
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_BUILD_PROFILE: development
                  EXPO_PUBLIC_ENABLE_DEV_SERVER: "1"
                  EXPO_PUBLIC_SERVER_URL: dev.vex.wtf
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.display_version }}
                  EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.sha }}
                  VEX_APP_ENV: development
                  VEX_APP_DISPLAY_NAME: Vex Development
                  VEX_APP_VERSION: ${{ steps.meta.outputs.version }}
                  VEX_ENABLE_DEV_BUILD: "1"
                  VEX_IOS_BUNDLE_IDENTIFIER: chat.vex.mobile.dev
                  VEX_PASSKEY_RP_HOST: dev.vex.wtf
                  VEX_IOS_ASSOCIATED_DOMAIN_MODE: normal
              run: |
                  eas build \
                    --profile development \
                    --platform all \
                    --non-interactive \
                    --wait \
                    --message "development ${GITHUB_SHA::8}" \
                    --json > /tmp/native-builds.json \
                    2> >(node scripts/redact-eas-log.cjs)

                  node <<'NODE' > /tmp/android-artifact-url
                  const fs = require("node:fs");
                  const raw = fs.readFileSync("/tmp/native-builds.json", "utf8");
                  const parsed = JSON.parse(raw);
                  const builds = Array.isArray(parsed) ? parsed : [parsed];
                  const build = builds.find((candidate) =>
                    String(candidate?.platform ?? "").toLowerCase() === "android"
                  );
                  const artifactUrl = build?.artifacts?.applicationArchiveUrl;
                  if (!artifactUrl) {
                    console.error("EAS Android build output did not include an APK artifact URL.");
                    console.error(build?.id ? `Build id: ${build.id}` : "Build id: unknown");
                    process.exit(1);
                  }
                  console.log(artifactUrl);
                  NODE

                  curl --fail --location --silent --show-error \
                    "$(cat /tmp/android-artifact-url)" \
                    --output "${{ github.workspace }}/vex-development.apk"
                  test -s "${{ github.workspace }}/vex-development.apk"

                  IOS_INSTALL_PROFILE=development \
                    IOS_INSTALL_CHANNEL=development \
                    IOS_BUNDLE_IDENTIFIER=chat.vex.mobile.dev \
                    node scripts/write-ios-install-metadata.cjs

            - name: Build release candidate notes
              if: steps.decide.outputs.path == 'build'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  PR=$(gh pr list \
                    --search "${{ github.sha }}" \
                    --state merged \
                    --base development \
                    --limit 1 \
                    --json number,title,author \
                    -q '.[0] // empty')

                  {
                    echo "## Release candidate"
                    echo ""
                    echo "Vex Development APK built from commit ${{ steps.meta.outputs.short_sha }}."
                    echo ""
                    echo "Direct latest APK:"
                    echo "https://github.com/${{ github.repository }}/releases/download/mobile-rc-latest/vex-development-latest.apk"
                    echo ""
                    echo "iOS install:"
                    node -pe "require('${{ github.workspace }}/ios-install.json').installUrl"
                    echo ""
                    echo "- Package id: \`chat.vex.mobile.dev\`"
                    echo "- Branch: \`development\`"
                    echo "- Commit: \`${{ github.sha }}\`"
                    if [ -n "$PR" ]; then
                      NUMBER=$(jq -r '.number' <<< "$PR")
                      TITLE=$(jq -r '.title' <<< "$PR")
                      AUTHOR=$(jq -r '.author.login' <<< "$PR")
                      echo "- Merged PR: #${NUMBER} ${TITLE} by @${AUTHOR}"
                    else
                      echo "- Source: direct push or merge commit"
                    fi
                  } > /tmp/mobile-rc-notes.md

                  cat /tmp/mobile-rc-notes.md

            - name: Create durable release candidate
              if: steps.decide.outputs.path == 'build'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cp vex-development.apk "${{ steps.meta.outputs.asset }}"
                  sha256sum "${{ steps.meta.outputs.asset }}" > "${{ steps.meta.outputs.asset }}.sha256"
                  cp /tmp/current-fingerprint.json fingerprint.json
                  cp /tmp/current-fingerprint-android.json fingerprint-android.json
                  cp /tmp/current-fingerprint-ios.json fingerprint-ios.json
                  TAG="${{ steps.meta.outputs.tag }}"
                  TITLE="Vex Development ${{ steps.meta.outputs.version }} RC (${{ steps.meta.outputs.short_sha }})"

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" fingerprint.json --clobber
                    gh release upload "$TAG" fingerprint-android.json --clobber
                    gh release upload "$TAG" fingerprint-ios.json --clobber
                    gh release upload "$TAG" ios-install.json --clobber
                    gh release upload "$TAG" "${{ steps.meta.outputs.asset }}" --clobber
                    gh release upload "$TAG" "${{ steps.meta.outputs.asset }}.sha256" --clobber
                    gh release edit "$TAG" \
                      --target "$GITHUB_SHA" \
                      --title "$TITLE" \
                      --notes-file /tmp/mobile-rc-notes.md \
                      --prerelease
                  else
                    gh release create "$TAG" "${{ steps.meta.outputs.asset }}" \
                      "${{ steps.meta.outputs.asset }}.sha256" \
                      fingerprint.json \
                      fingerprint-android.json \
                      fingerprint-ios.json \
                      ios-install.json \
                      --target "$GITHUB_SHA" \
                      --prerelease \
                      --title "$TITLE" \
                      --notes-file /tmp/mobile-rc-notes.md
                  fi

            - name: Update rolling release candidate pointer
              if: steps.decide.outputs.path == 'build'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="mobile-rc-latest"
                  TITLE="Vex Development RC (latest)"
                  cp vex-development.apk vex-development-latest.apk
                  sha256sum vex-development-latest.apk > vex-development-latest.apk.sha256
                  sha256sum "${{ steps.meta.outputs.asset }}" > "${{ steps.meta.outputs.asset }}.sha256"
                  gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
                  gh release create "$TAG" vex-development-latest.apk vex-development-latest.apk.sha256 "${{ steps.meta.outputs.asset }}" "${{ steps.meta.outputs.asset }}.sha256" fingerprint.json fingerprint-android.json fingerprint-ios.json ios-install.json \
                    --target "$GITHUB_SHA" \
                    --prerelease \
                    --latest=false \
                    --title "$TITLE" \
                    --notes-file /tmp/mobile-rc-notes.md
