name: Mobile - PR Native Build

# Builds native Android + iOS artifacts for trusted PRs targeting development
# or master when native/runtime inputs changed, or when maintainers add the
# `native-build` / `eas-native-build` label. This intentionally does not publish
# OTA updates or GitHub Releases.
#
# Security model:
# - uses pull_request, not pull_request_target, so fork PR code never receives
#   repository secrets
# - additionally requires same-repository PR branches from users with repo write
#   permission or stronger
# - skips draft PRs to avoid burning EAS builds before review readiness
# - skips JS-only PRs to preserve the limited EAS free-tier build quota

on:
    pull_request:
        branches: [development, master]
        types:
            [
                opened,
                synchronize,
                reopened,
                ready_for_review,
                labeled,
                unlabeled,
            ]

concurrency:
    group: mobile-pr-native-${{ github.event.pull_request.number }}
    cancel-in-progress: false

permissions:
    contents: read
    pull-requests: read

jobs:
    policy:
        name: EAS PR build policy
        runs-on: ubuntu-latest
        outputs:
            allowed: ${{ steps.policy.outputs.allowed }}
            channel: ${{ steps.policy.outputs.channel }}
            display_name: ${{ steps.policy.outputs.display_name }}
            enable_dev_build: ${{ steps.policy.outputs.enable_dev_build }}
            expected_android_package: ${{ steps.policy.outputs.expected_android_package }}
            ios_bundle_identifier: ${{ steps.policy.outputs.ios_bundle_identifier }}
            should_build: ${{ steps.policy.outputs.should_build }}
            profile: ${{ steps.policy.outputs.profile }}
            server_url: ${{ steps.policy.outputs.server_url }}
        steps:
            - name: Evaluate PR safety policy
              id: policy
              env:
                  AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
                  DRAFT: ${{ github.event.pull_request.draft }}
                  GH_TOKEN: ${{ github.token }}
                  HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_USER: ${{ github.event.pull_request.user.login }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  ALLOWED=false
                  BUILD_REASON=""
                  REASON=""
                  SHOULD_BUILD=false
                  PERMISSION="unknown"
                  PROFILE=""
                  CHANNEL=""
                  DISPLAY_NAME=""
                  ENABLE_DEV_BUILD=""
                  EXPECTED_ANDROID_PACKAGE=""
                  IOS_BUNDLE_IDENTIFIER=""
                  SERVER_URL=""
                  NATIVE_CHANGED_FILES=""

                  if [ -n "${PR_USER:-}" ]; then
                    PERMISSION="$(
                      gh api "repos/${REPOSITORY}/collaborators/${PR_USER}/permission" \
                        --jq '.permission' 2>/dev/null || echo unknown
                    )"
                  fi

                  if [ "$DRAFT" = "true" ]; then
                    REASON="draft PR"
                  elif [ "$HEAD_REPO" != "$REPOSITORY" ]; then
                    REASON="PR branch is from a fork"
                  elif [ "$PERMISSION" != "admin" ] && \
                       [ "$PERMISSION" != "maintain" ] && \
                       [ "$PERMISSION" != "write" ]; then
                    REASON="repo permission is ${PERMISSION}, not write-trusted"
                  else
                    case "$BASE_REF" in
                      development)
                        ALLOWED=true
                        PROFILE=development
                        CHANNEL=development
                        DISPLAY_NAME="Vex Development"
                        ENABLE_DEV_BUILD=1
                        EXPECTED_ANDROID_PACKAGE="chat.vex.mobile.dev"
                        IOS_BUNDLE_IDENTIFIER="chat.vex.mobile.dev"
                        SERVER_URL="dev.vex.wtf"
                        ;;
                      master)
                        ALLOWED=true
                        PROFILE=production
                        CHANNEL=production
                        DISPLAY_NAME="Vex"
                        ENABLE_DEV_BUILD=0
                        EXPECTED_ANDROID_PACKAGE="chat.vex.mobile"
                        IOS_BUNDLE_IDENTIFIER="chat.vex.mobile"
                        SERVER_URL="api.vex.wtf"
                        ;;
                      *)
                        REASON="unsupported base branch ${BASE_REF}"
                        ;;
                    esac
                  fi

                  if [ "$ALLOWED" = "true" ]; then
                    LABEL_BUILD="$(
                      jq -r '.[].name' <<< "$PR_LABELS_JSON" |
                        grep -Eix 'native-build|eas-native-build' >/dev/null &&
                        echo true || echo false
                    )"

                    gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
                      --paginate \
                      --jq '.[].filename' > /tmp/pr-files

                    while IFS= read -r FILE; do
                      case "$FILE" in
                        .tool-versions | \
                        package.json | \
                        pnpm-lock.yaml | \
                        pnpm-workspace.yaml | \
                        apps/mobile/app.config.js | \
                        apps/mobile/app.json | \
                        apps/mobile/eas.json | \
                        apps/mobile/package.json | \
                        apps/mobile/assets/* | \
                        apps/mobile/plugins/* | \
                        apps/mobile/credentials* | \
                        apps/mobile/google-services*.json)
                          NATIVE_CHANGED_FILES="${NATIVE_CHANGED_FILES}${FILE}"$'\n'
                          ;;
                      esac
                    done < /tmp/pr-files

                    if [ "$LABEL_BUILD" = "true" ]; then
                      SHOULD_BUILD=true
                      BUILD_REASON="native-build label"
                    elif [ -n "$NATIVE_CHANGED_FILES" ]; then
                      SHOULD_BUILD=true
                      BUILD_REASON="native/runtime-affecting file changes"
                    else
                      REASON="no native/runtime-affecting file changes and no native-build label"
                    fi
                  fi

                  {
                    echo "allowed=$ALLOWED"
                    echo "channel=$CHANNEL"
                    echo "display_name=$DISPLAY_NAME"
                    echo "enable_dev_build=$ENABLE_DEV_BUILD"
                    echo "expected_android_package=$EXPECTED_ANDROID_PACKAGE"
                    echo "ios_bundle_identifier=$IOS_BUNDLE_IDENTIFIER"
                    echo "should_build=$SHOULD_BUILD"
                    echo "profile=$PROFILE"
                    echo "server_url=$SERVER_URL"
                  } >> "$GITHUB_OUTPUT"

                  {
                    echo "### Mobile PR EAS build policy"
                    echo ""
                    echo "- Allowed: \`$ALLOWED\`"
                    echo "- Base branch: \`$BASE_REF\`"
                    echo "- Author association: \`$AUTHOR_ASSOCIATION\`"
                    echo "- Repo permission: \`$PERMISSION\`"
                    echo "- Same-repository branch: \`$([ "$HEAD_REPO" = "$REPOSITORY" ] && echo true || echo false)\`"
                    if [ "$ALLOWED" = "true" ]; then
                      echo "- EAS profile: \`$PROFILE\`"
                      echo "- Channel: \`$CHANNEL\`"
                      echo "- Will run EAS build: \`$SHOULD_BUILD\`"
                      if [ "$SHOULD_BUILD" = "true" ]; then
                        echo "- Build reason: $BUILD_REASON"
                        if [ -n "$NATIVE_CHANGED_FILES" ]; then
                          echo ""
                          echo "Native/runtime-affecting files:"
                          printf '%s' "$NATIVE_CHANGED_FILES" | sed 's/^/- `/' | sed 's/$/`/'
                        fi
                      else
                        echo "- Skip reason: $REASON"
                      fi
                    else
                      echo "- Skip reason: $REASON"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

    native-build:
        name: EAS native build
        needs: policy
        if: needs.policy.outputs.should_build == 'true'
        runs-on: ubuntu-latest
        env:
            EAS_BUILD_PROFILE: ${{ needs.policy.outputs.profile }}
            EXPO_PUBLIC_ENABLE_DEV_SERVER: ${{ needs.policy.outputs.profile == 'development' && '1' || '0' }}
            EXPO_PUBLIC_SERVER_URL: ${{ needs.policy.outputs.server_url }}
            EXPO_PUBLIC_VEX_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
            VEX_APP_DISPLAY_NAME: ${{ needs.policy.outputs.display_name }}
            VEX_APP_ENV: ${{ needs.policy.outputs.profile }}
            VEX_ENABLE_DEV_BUILD: ${{ needs.policy.outputs.enable_dev_build }}
            VEX_IOS_BUNDLE_IDENTIFIER: ${{ needs.policy.outputs.ios_bundle_identifier }}
            VEX_PASSKEY_RP_HOST: ${{ needs.policy.outputs.server_url }}
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
              with:
                  egress-policy: audit

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .tool-versions
                  cache: pnpm

            - run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Prepare Firebase config
              working-directory: apps/mobile
              env:
                  GOOGLE_SERVICES_JSON: ${{ needs.policy.outputs.profile == 'development' && secrets.VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON || secrets.VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON }}
                  GOOGLE_SERVICES_JSON_BASE64: ${{ needs.policy.outputs.profile == 'development' && secrets.VEX_ANDROID_GOOGLE_SERVICES_DEV_JSON_BASE64 || secrets.VEX_ANDROID_GOOGLE_SERVICES_PROD_JSON_BASE64 }}
                  EXPECTED_ANDROID_PACKAGE: ${{ needs.policy.outputs.expected_android_package }}
              run: |
                  if [ "$EAS_BUILD_PROFILE" = "development" ]; then
                    GOOGLE_SERVICES_PATH="google-services.dev.json"
                  else
                    GOOGLE_SERVICES_PATH="google-services.prod.json"
                  fi
                  export GOOGLE_SERVICES_PATH
                  if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
                    printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GOOGLE_SERVICES_PATH"
                  elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
                    printf '%s' "$GOOGLE_SERVICES_JSON" > "$GOOGLE_SERVICES_PATH"
                  else
                    echo "::error::Missing Firebase google-services JSON secret for ${EAS_BUILD_PROFILE}."
                    exit 1
                  fi

                  node -e '
                    const fs = require("node:fs");
                    const path = process.env.GOOGLE_SERVICES_PATH;
                    const expected = process.env.EXPECTED_ANDROID_PACKAGE;
                    const data = JSON.parse(fs.readFileSync(path, "utf8"));
                    const packages = (data.client ?? [])
                      .map((client) => client.client_info?.android_client_info?.package_name)
                      .filter(Boolean);
                    if (!packages.includes(expected)) {
                      console.error(`${path} does not contain Android package ${expected}`);
                      console.error(`Found package(s): ${packages.join(", ") || "(none)"}`);
                      process.exit(1);
                    }
                  '
                  echo "VEX_ANDROID_GOOGLE_SERVICES_FILE=./${GOOGLE_SERVICES_PATH}" >> "$GITHUB_ENV"

            - name: Resolve PR build metadata
              id: meta
              working-directory: apps/mobile
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  PACKAGE_VERSION="$(node -pe "require('./package.json').version")"
                  SHORT_SHA="${PR_HEAD_SHA::8}"
                  BUILD_LABEL="${PACKAGE_VERSION}PR-${PR_NUMBER}-${SHORT_SHA}"

                  {
                    echo "package_version=$PACKAGE_VERSION"
                    echo "short_sha=$SHORT_SHA"
                    echo "build_label=$BUILD_LABEL"
                  } >> "$GITHUB_OUTPUT"

            - name: Compute runtime fingerprints
              working-directory: apps/mobile
              env:
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.package_version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
                  VEX_APP_VERSION: ${{ steps.meta.outputs.package_version }}
              run: |
                  npx expo-updates fingerprint:generate --platform android --workflow managed > /tmp/current-fingerprint-android.json
                  npx expo-updates fingerprint:generate --platform ios --workflow managed > /tmp/current-fingerprint-ios.json
                  npx @expo/fingerprint@latest . > /tmp/current-fingerprint.json

                  ANDROID_HASH=$(node -pe "require('/tmp/current-fingerprint-android.json').hash")
                  IOS_HASH=$(node -pe "require('/tmp/current-fingerprint-ios.json').hash")
                  LEGACY_HASH=$(node -pe "require('/tmp/current-fingerprint.json').hash")

                  echo "Android runtime fingerprint: $ANDROID_HASH"
                  echo "iOS runtime fingerprint: $IOS_HASH"
                  echo "Legacy fingerprint: $LEGACY_HASH"

            - name: Install EAS CLI
              run: npm install -g eas-cli@latest

            - name: Prepare EAS remote build env
              working-directory: apps/mobile
              env:
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.package_version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
                  VEX_APP_VERSION: ${{ steps.meta.outputs.package_version }}
              run: node scripts/prepare-eas-build-env.cjs

            - name: Build PR native artifacts
              working-directory: apps/mobile
              env:
                  EXPO_PUBLIC_VEX_APP_VERSION: ${{ steps.meta.outputs.package_version }}
                  EXPO_PUBLIC_VEX_BUILD_LABEL: ${{ steps.meta.outputs.build_label }}
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  VEX_APP_VERSION: ${{ steps.meta.outputs.package_version }}
              run: |
                  if [ -z "${EXPO_TOKEN:-}" ]; then
                    echo "::error::Missing EXPO_TOKEN; PR native builds require repository secrets."
                    exit 1
                  fi

                  eas build \
                    --profile "$EAS_BUILD_PROFILE" \
                    --platform all \
                    --non-interactive \
                    --wait \
                    --message "PR #${PR_NUMBER} ${EAS_BUILD_PROFILE} ${{ steps.meta.outputs.short_sha }}" \
                    --json > /tmp/native-builds.json \
                    2> >(node scripts/redact-eas-log.cjs)

                  node <<'NODE'
                  const fs = require("node:fs");
                  const path = require("node:path");

                  const raw = fs.readFileSync("/tmp/native-builds.json", "utf8");
                  const parsed = JSON.parse(raw);
                  const builds = Array.isArray(parsed) ? parsed : [parsed];
                  const findBuild = (platform) =>
                    builds.find(
                      (candidate) =>
                        String(candidate?.platform ?? "").toLowerCase() === platform
                    );
                  const android = findBuild("android");
                  const ios = findBuild("ios");
                  const androidUrl = android?.artifacts?.applicationArchiveUrl;
                  const iosUrl = ios?.artifacts?.applicationArchiveUrl ?? ios?.artifacts?.buildUrl;

                  if (!androidUrl) {
                    console.error("EAS Android build output did not include an APK artifact URL.");
                    console.error(android?.id ? `Build id: ${android.id}` : "Build id: unknown");
                    process.exit(1);
                  }
                  if (!ios?.id) {
                    console.error("EAS iOS build output did not include a build id.");
                    process.exit(1);
                  }

                  const iosInstallUrl = `https://expo.dev/accounts/vex-chat/projects/vex/builds/${ios.id}`;
                  const iosInstall = {
                    platform: "ios",
                    provider: "expo",
                    profile: process.env.EAS_BUILD_PROFILE,
                    channel: process.env.EAS_BUILD_PROFILE,
                    bundleIdentifier: process.env.VEX_IOS_BUNDLE_IDENTIFIER,
                    buildId: ios.id,
                    installUrl: iosInstallUrl,
                    artifactUrl: iosUrl,
                    commit: process.env.EXPO_PUBLIC_VEX_COMMIT_SHA,
                    fingerprint: JSON.parse(
                      fs.readFileSync("/tmp/current-fingerprint-ios.json", "utf8")
                    ).hash,
                    createdAt: new Date().toISOString()
                  };
                  fs.writeFileSync(
                    path.join(process.env.GITHUB_WORKSPACE, "ios-install.json"),
                    `${JSON.stringify(iosInstall, null, 2)}\n`
                  );

                  const summary = [
                    "### Mobile PR EAS build",
                    "",
                    `- Profile: \`${process.env.EAS_BUILD_PROFILE}\``,
                    `- Build label: \`${process.env.EXPO_PUBLIC_VEX_BUILD_LABEL}\``,
                    `- Android build: ${android.id ? `\`${android.id}\`` : "_unknown_"}`,
                    `- Android APK: [download](${androidUrl})`,
                    `- iOS build: \`${ios.id}\``,
                    `- iOS install: [open in Expo](${iosInstallUrl})`,
                    iosUrl ? `- iOS artifact: [download](${iosUrl})` : undefined,
                    ""
                  ].filter(Boolean);

                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join("\n")}\n`);
                  NODE
