name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master, development]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            store: ${{ steps.changes.outputs.store }}
            desktop: ${{ steps.changes.outputs.desktop }}
            mobile: ${{ steps.changes.outputs.mobile }}
            website: ${{ steps.changes.outputs.website }}
            ui: ${{ steps.changes.outputs.ui }}
            lint-config: ${{ steps.changes.outputs.lint-config }}
            root: ${{ steps.changes.outputs.root }}
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: changes
              with:
                  filters: |
                      store:
                        - 'packages/store/**'
                      desktop:
                        - 'apps/desktop/**'
                      mobile:
                        - 'apps/mobile/**'
                      website:
                        - 'apps/website/**'
                      ui:
                        - 'packages/ui/**'
                      lint-config:
                        - 'packages/eslint-config/**'
                      root:
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - '.pnpmfile.cjs'
                        - 'tsconfig.json'
                        - 'eslint.config.js'

    # ── Always runs — fast, catches formatting issues across all files ──────
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm format:check

    # ── Lint — only affected packages ──────────────────────────────────────
    lint:
        needs: detect-changes
        if: >-
            needs.detect-changes.outputs.store == 'true' ||
            needs.detect-changes.outputs.desktop == 'true' ||
            needs.detect-changes.outputs.mobile == 'true' ||
            needs.detect-changes.outputs.website == 'true' ||
            needs.detect-changes.outputs.ui == 'true' ||
            needs.detect-changes.outputs.lint-config == 'true' ||
            needs.detect-changes.outputs.root == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Sherif — workspace version consistency
              # -i vite: desktop on vite 7, ui/storybook on vite 6. Re-enable
              # once packages/ui upgrades to a vite-7-compatible Storybook.
              run: pnpm dlx sherif@latest -i vite
            - name: Lint affected packages
              env:
                  BASE_REF: ${{ github.base_ref || 'master' }}
              run: |
                  if [ "${{ needs.detect-changes.outputs.root }}" == "true" ] || \
                     [ "${{ needs.detect-changes.outputs.lint-config }}" == "true" ]; then
                    pnpm -r --if-present lint
                  else
                    pnpm --filter "...[origin/${BASE_REF}]" --if-present lint
                  fi

    # ── License — workspace license policy ────────────────────────────────
    license:
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - name: License check
              run: pnpm -r --if-present license:check

    # ── Store — type check + test ──────────────────────────────────────────
    check-store:
        needs: detect-changes
        if: >-
            needs.detect-changes.outputs.store == 'true' ||
            needs.detect-changes.outputs.root == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm --filter @vex-chat/store --if-present check
            - run: pnpm --filter @vex-chat/store --if-present test

    # ── Desktop — Svelte check (triggered by desktop OR store changes) ─────
    check-desktop:
        needs: detect-changes
        if: >-
            needs.detect-changes.outputs.desktop == 'true' ||
            needs.detect-changes.outputs.store == 'true' ||
            needs.detect-changes.outputs.root == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Svelte check
              run: pnpm --filter @vex-chat/desktop check

    # ── Mobile — type check (triggered by mobile OR store changes) ─────────
    check-mobile:
        needs: detect-changes
        if: >-
            needs.detect-changes.outputs.mobile == 'true' ||
            needs.detect-changes.outputs.store == 'true' ||
            needs.detect-changes.outputs.root == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm --filter @vex-chat/mobile --if-present check

    # ── Website — type check + test + production build ────────────────────
    check-website:
        needs: detect-changes
        if: >-
            needs.detect-changes.outputs.website == 'true' ||
            needs.detect-changes.outputs.root == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm --filter @vex-chat/website --if-present check
            - run: pnpm --filter @vex-chat/website --if-present test
            - run: pnpm --filter @vex-chat/website --if-present build

    # ── UI — Mitosis build (standalone, no dependents) ─────────────────────
    check-ui:
        needs: detect-changes
        if: >-
            needs.detect-changes.outputs.ui == 'true' ||
            needs.detect-changes.outputs.root == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm --filter @vex-chat/ui build

    # ── CI OK — single umbrella check for branch protection ───────────────
    # Green only when every other job above either succeeded or was
    # legitimately skipped (path-filter didn't match). Failed or cancelled
    # jobs fail this check. Set "CI OK" as the required status in the
    # master branch protection rule — you get one knob that tracks the
    # whole pipeline, and adding / removing CI jobs doesn't need a
    # branch-protection config edit.
    ci-ok:
        name: CI OK
        needs:
            - detect-changes
            - format
            - lint
            - license
            - check-store
            - check-desktop
            - check-mobile
            - check-website
            - check-ui
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Fail on any upstream failure or cancellation
              if: >-
                  contains(needs.*.result, 'failure') ||
                  contains(needs.*.result, 'cancelled')
              run: |
                  echo "One or more CI jobs failed or were cancelled."
                  echo "Job results:"
                  echo '${{ toJSON(needs) }}'
                  exit 1
            - name: Report success
              run: echo "All CI jobs passed or were legitimately skipped."
